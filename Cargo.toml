[package]
name = "quant-research-framework-rs"
version = "0.3.3"
edition = "2021"
description = "Walk-forward backtester with robustness tests (Rust port of quant-research-framework)"
license = "MIT"
repository = "https://github.com/DaruFinance/quant-research-framework-rs"

[dependencies]
# Pinned to "=0.9" because rand 0.10 makes `random_range` / `random` trait
# methods on `RngExt`, breaking call sites in src/lib.rs (Monte Carlo,
# news-candle injection, indicator-variance overlay) until they are
# rewritten with explicit `use rand::Rng;` imports. See dependabot PR
# closing notes; bump once the trait-method migration is folded into a
# behavioural-change release window.
rand = "=0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }

# Optional. Pulled in only when the `panel` feature is active. Item #1
# (Phase 2) uses ndarray for the time × asset × field N-D array; csv
# reads the per-asset OHLC files; serde plumbing through csv.
ndarray = { version = "0.16", optional = true }
csv = { version = "1.3", optional = true }

[features]
# Phase 2 panel plugin (items #1, #4, #5(iter), #6-#8, #44-#45).
# Mirrors Python's `pip install quant-research-framework[panel]`.
panel = ["dep:ndarray", "dep:csv"]
# Phase 3 T2 pairs plugin (items #9, #10, #11, #12, #13). Mirrors
# Python's `pip install quant-research-framework[pairs]`.  Depends on
# the panel substrate for the (time × asset × field) N-D array shape.
pairs = ["panel"]
# Phase 3 T6 carry plugin (items #38, #39, #39s, #40, #41, #42, #43).
# Mirrors Python's `pip install quant-research-framework[carry]`.
# Loaders read CSV; parquet would add a heavyweight cross-language
# dep we don't need (the parity scripts always shake out CSV first).
carry = ["panel"]

[dev-dependencies]
# Rayon is used only by the parallel batch_runner example; it is NOT a
# runtime dependency of the engine and does not appear in the published
# parity claim of three direct deps in §5.1 of the paper.
rayon = "1.10"

[[bin]]
name = "backtester"
path = "src/main.rs"

[[example]]
name = "batch_runner"
path = "examples/batch_runner.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
