# Parity CI: builds this Rust port and runs the cross-language metric
# diff against the matching commit of quant-research-framework on
# every PR and on push to main.
#
# A green check here means: (a) cargo test passes (behavioural and
# invariant tests in tests/), (b) cargo clippy is clean, and (c) the
# Python reference at the same coordinated tag produces identical
# metrics on the three published surfaces (default-config, regime+WFO,
# forex).

name: parity

on:
  push:                 # every branch, correctness is gated on every push, not just main
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # the v0.6.0 surfaces + benchmark each re-run the 6x6 WFO

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: quant-research-framework-rs

      - name: Checkout the Python reference (coordinated tag/branch)
        uses: actions/checkout@v7
        with:
          repository: DaruFinance/quant-research-framework
          ref: main
          path: quant-research-framework

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: quant-research-framework-rs

      # cargo fmt --check is intentionally NOT enforced: the examples/ tree is
      # hand-formatted (aligned match arrows, single-line if/else for readability)
      # and rustfmt would mangle that style. Run `cargo fmt -- --check` locally
      # if you want to see diffs.

      - name: cargo clippy
        working-directory: quant-research-framework-rs
        run: cargo clippy --release --no-deps -- -D warnings

      - name: cargo test --release
        working-directory: quant-research-framework-rs
        run: cargo test --release

      - name: Build the release binary
        working-directory: quant-research-framework-rs
        run: cargo build --release

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Consistency guard (license / version / headline figures across artifacts)
        working-directory: quant-research-framework-rs
        run: python tools/check_consistency.py

      - name: Install Python framework deps
        working-directory: quant-research-framework
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Multi-asset substrate extras so the panel/pairs/carry parity
          # harnesses can import backtester.{panel,pairs,carry}
          # (statsmodels, xarray, pyarrow, scipy).
          pip install -e ".[panel,pairs,carry]"

      - name: Parity, default config (56 metric points, SOLUSDT 1h)
        working-directory: quant-research-framework-rs
        run: python tools/parity_check.py --csv data/SOLUSDT_1h.csv --tol 0.001

      - name: Parity, regime + WFO (98 metric points, SOLUSDT 1h)
        working-directory: quant-research-framework-rs
        run: python tools/parity_regime.py --csv data/SOLUSDT_1h.csv --tol 0.001

      - name: Parity, forex mode (56 metric points, EURUSD 1h)
        working-directory: quant-research-framework-rs
        run: python tools/parity_forex.py --csv data/EURUSD_1h.csv --tol 0.001

      - name: Parity, ledger row-by-row (SOLUSDT 1h)
        working-directory: quant-research-framework-rs
        run: python tools/parity_ledger.py --csv data/SOLUSDT_1h.csv --tol 0.001

      - name: Parity, default config on BTC 30m (146k bars)
        working-directory: quant-research-framework-rs
        run: python tools/parity_check.py --csv data/BTCUSDT_30m.csv --tol 0.001

      - name: Parity, default config on DOGE 30m (117k bars)
        working-directory: quant-research-framework-rs
        run: python tools/parity_check.py --csv data/DOGEUSDT_30m.csv --tol 0.001

      - name: Parity, default config on 100k synthetic GBM
        working-directory: quant-research-framework-rs
        run: python tools/parity_check.py --csv data/SYNTH_100k.csv --tol 0.001

      # ---- v0.5.0 multi-asset core surfaces (item 07) ----
      - name: Parity, four-way combo (regime + WFO + forex + session, EURUSD 1h)
        working-directory: quant-research-framework-rs
        run: python tools/parity_combo.py --csv data/EURUSD_1h.csv --tol 0.001

      - name: Parity, panel substrate (regime / baskets / ERC / neutralisations)
        working-directory: quant-research-framework-rs
        # Default per-key tolerances (all far inside the 1e-3 published standard;
        # the ERC iterative solver agrees to ~3e-5). --strict tightens ERC to
        # 1e-6 and is solver-sensitive by design, so it is not the CI gate.
        run: python tools/parity_panel.py

      - name: Parity, pairs primitives (spread / screener / cadence / stops)
        working-directory: quant-research-framework-rs
        run: python tools/parity_pairs.py --tol 0.001

      - name: Parity, carry primitives (funding / basis / OI / triggers / models)
        working-directory: quant-research-framework-rs
        run: python tools/parity_carry.py --tol 0.001

      # ---- v0.6.0 surfaces (items 5 / 2 / 1 / 3). These need the Python engine
      # at the coordinated v0.6.0 (volume_indicators, opt_surface, haircut, the
      # dsr/pbo additions); keep the Python `ref` above in lockstep at release. ----
      - name: Build gated examples (indicators / overfit)
        working-directory: quant-research-framework-rs
        run: |
          cargo build  --release --features indicators --example batch_runner
          cargo clippy --release --features indicators --example batch_runner -- -D warnings
          cargo build  --release --features overfit
          cargo clippy --release --features overfit --no-deps -- -D warnings

      - name: Parity, shared indicators (SMA/EMA/MACD/RSI/ATR/Stochastic)
        working-directory: quant-research-framework-rs
        run: python tools/parity_indicators.py --tol 0.001

      - name: Parity, volume indicators + strategy
        working-directory: quant-research-framework-rs
        run: python tools/parity_volume.py --tol 0.001

      - name: Parity, IS objective surface (2-axis + SL-3axis + bar-Sharpe)
        working-directory: quant-research-framework-rs
        run: |
          python tools/parity_surface.py
          python tools/parity_surface.py --sl3
          python tools/parity_surface.py --sharpe bar --irregular

      - name: Parity, overfitting stats (PBO / multitest / overfit-lines guard)
        working-directory: quant-research-framework-rs
        run: |
          python tools/parity_pbo.py --tol 0.001
          python tools/parity_multitest.py --tol 0.001
          python tools/parity_overfit_lines.py

      # ---- v0.6.0 reproducible benchmark (item 4): golden drift + cross-engine ----
      - name: Benchmark, golden drift-guard + cross-engine (1e-3)
        working-directory: quant-research-framework-rs
        run: |
          cargo build --release --example benchmark_runner
          python tools/benchmark.py --check
          ./target/release/examples/benchmark_runner --manifest tools/benchmark_manifest.toml --out /tmp/bench_rust.csv
          python tools/benchmark.py --cross-engine --rust-csv /tmp/bench_rust.csv --tol 0.001
